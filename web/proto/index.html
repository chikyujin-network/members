<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR受付の試作</title>
  <link rel="icon" href="../assets/brand/favicon.ico">
  <link rel="stylesheet" href="../assets/app.css">
  <script src="../config.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <header>
    <img src="../assets/brand/logo-komagane.png" alt="">
    <h1>QR受付の試作（段階0）</h1>
  </header>
  <main>
    <div class="card">
      <p>スマホのカメラでQRを読み、テスト用スプレッドシートに1行書き込めるかを確かめます。</p>
      <p><button id="ping">1. APIにつながるか確認</button></p>
      <p id="pingResult" class="muted"></p>
    </div>
    <div class="card">
      <p><button id="start">2. カメラを起動してQRを読む</button></p>
      <div id="reader"></div>
      <p id="scanResult" class="muted"></p>
    </div>
  </main>
  <script>
    const api = window.APP_CONFIG.apiUrl;
    const $ = (id) => document.getElementById(id);

    // Content-Type を text/plain にして、CORS のプリフライトを避ける
    async function call(body) {
      if (!api) throw new Error('config.js の apiUrl が未設定です');
      const res = await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
      });
      return res.json();
    }

    function show(el, ok, text) {
      el.className = ok ? 'ok' : 'ng';
      el.textContent = text;
    }

    $('ping').onclick = async () => {
      try {
        const r = await call({ action: 'ping' });
        show($('pingResult'), r.ok, r.ok ? `OK（サーバー時刻 ${r.time}）` : `エラー: ${r.error}`);
      } catch (e) {
        show($('pingResult'), false, `エラー: ${e.message}`);
      }
    };

    let scanner = null;
    let busy = false;
    $('start').onclick = async () => {
      $('start').disabled = true;
      scanner = new Html5Qrcode('reader');
      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 240 },
          async (text) => {
            if (busy) return;
            busy = true;
            try {
              const r = await call({ action: 'proto.append', text });
              show($('scanResult'), r.ok, r.ok ? `書き込みました（${r.row}行目）: ${text}` : `エラー: ${r.error}`);
            } catch (e) {
              show($('scanResult'), false, `エラー: ${e.message}`);
            } finally {
              setTimeout(() => { busy = false; }, 1500); // 同じQRの連続読み取りを防ぐ
            }
          },
          () => {},
        );
      } catch (e) {
        show($('scanResult'), false, `カメラを起動できません: ${e}`);
        $('start').disabled = false;
      }
    };
  </script>
</body>
</html>
