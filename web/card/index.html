<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5893d1">
  <title>会員証｜地球人ネットワークinこまがね</title>
  <link rel="icon" href="../assets/brand/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    :root {
      --blue: #5893d1;
      --blue-deep: #3f78b8;
      --yellow: #e2bd5c;
      --navy: #242c6c;
      --lavender: #c5cbe7;
      --paper: #f6f8fc;
      --ink: #1d2340;
      --muted: #5a6080;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }
    main { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }

    .sample-banner {
      background: var(--yellow);
      color: var(--navy);
      font-weight: 700;
      text-align: center;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    /* スマホ版の会員証 */
    .card {
      position: relative;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 1px 0 var(--lavender), 0 12px 32px rgba(36, 44, 108, 0.12);
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: var(--blue);
      color: #fff;
    }
    .card-head img { width: 52px; height: 52px; flex: none; }
    .card-head .org { font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; }
    .card-head .kind { font-size: 0.8rem; opacity: 0.9; }
    .card-body { padding: 22px 20px 8px; text-align: center; }
    .hello { font-size: 0.85rem; color: var(--muted); }
    .nickname {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
      margin: 2px 0 6px;
      word-break: break-word;
    }
    .legal { font-size: 1rem; color: var(--ink); }
    .kana { font-size: 0.8rem; color: var(--muted); }
    .qr {
      margin: 18px auto 10px;
      width: 220px;
      height: 220px;
      padding: 10px;
      background: #fff;
      border: 2px solid var(--lavender);
      border-radius: 16px;
    }
    .qr svg { width: 100%; height: 100%; display: block; }
    .number {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--navy);
    }
    .number-label { font-size: 0.75rem; color: var(--muted); }
    .card-foot {
      margin-top: 14px;
      padding: 12px 18px 16px;
      border-top: 1px dashed var(--lavender);
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    .card-foot strong { color: var(--ink); }
    .stripe { height: 8px; background: linear-gradient(90deg, var(--blue) 0 70%, var(--yellow) 70% 100%); }

    .tip {
      margin: 18px 4px 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .tip li { margin-bottom: 4px; }

    /* 紙版（名刺サイズ 91×55mm） */
    h2 { font-size: 1rem; color: var(--navy); margin: 36px 4px 10px; }
    .paper {
      width: 100%;
      aspect-ratio: 91 / 55;
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--lavender);
      display: grid;
      grid-template-columns: 1fr 38%;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(36, 44, 108, 0.08);
    }
    .paper-left { padding: 4% 4% 4% 5%; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .paper-org { display: flex; align-items: center; gap: 6px; font-size: 0.6rem; line-height: 1.3; font-weight: 700; color: var(--navy); }
    .paper-org img { width: 24px; height: 24px; }
    .paper-nick { font-size: 1.6rem; font-weight: 800; color: var(--navy); line-height: 1.1; }
    .paper-legal { font-size: 0.7rem; }
    .paper-no { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 0.85rem; color: var(--navy); letter-spacing: 0.06em; }
    .paper-right { background: var(--blue); display: flex; align-items: center; justify-content: center; padding: 6%; }
    .paper-right .qr-small { background: #fff; border-radius: 8px; padding: 6%; width: 100%; aspect-ratio: 1; }
    .paper-right svg { width: 100%; height: 100%; display: block; }

    @media (prefers-color-scheme: dark) {
      body { background: #121630; }
      .tip, h2 { color: #c5cbe7; }
    }
  </style>
</head>
<body>
  <main>
    <div class="sample-banner" id="sampleBanner">見本（架空の会員です）／ SAMPLE</div>

    <section class="card" aria-label="会員証">
      <div class="card-head">
        <img src="../assets/brand/logo-komagane.png" alt="">
        <div>
          <div class="org">地球人ネットワークinこまがね</div>
          <div class="kind">会員証 ／ Membership Card</div>
        </div>
      </div>
      <div class="card-body">
        <div class="hello">こんにちは ／ Hello</div>
        <div class="nickname" id="nickname"></div>
        <div class="legal" id="legalName"></div>
        <div class="kana" id="kana"></div>
        <div class="qr" id="qr" role="img" aria-label="受付用のQRコード"></div>
        <div class="number-label">会員番号 ／ Member No.</div>
        <div class="number" id="memberNo"></div>
      </div>
      <div class="card-foot">
        <strong>うけつけで この がめんを みせてください。</strong><br>
        Please show this screen at the reception.
      </div>
      <div class="stripe"></div>
    </section>

    <ul class="tip">
      <li>ホーム画面に追加すると、いつでもすぐに開けます。</li>
      <li>このページのURLは会員証と同じです。ほかの人に送らないでください。</li>
    </ul>

    <h2>紙の会員証（名刺サイズ）の見本</h2>
    <section class="paper" aria-label="紙の会員証の見本">
      <div class="paper-left">
        <div class="paper-org"><img src="../assets/brand/logo-komagane.png" alt=""><span>地球人ネットワークinこまがね<br>会員証 ／ Membership Card</span></div>
        <div>
          <div class="paper-nick" id="paperNick"></div>
          <div class="paper-legal" id="paperLegal"></div>
        </div>
        <div class="paper-no" id="paperNo"></div>
      </div>
      <div class="paper-right"><div class="qr-small" id="paperQr"></div></div>
    </section>
  </main>

  <script>
    // 見本のデータ（架空の会員）。本番では会員番号とトークンで API から読み込む
    const SAMPLE = {
      memberNo: '001-00123',
      token: 'sample-token',
      nickname: 'ラン',
      legalName: 'NGUYEN Thi Lan',
      kana: 'グエン ティ ラン',
    };

    // 受付で読み取るQRの中身：会員番号とトークンだけ（氏名や連絡先は入れない）
    function qrPayload(m) {
      return `CJN1:${m.memberNo}:${m.token}`;
    }

    function drawQr(el, text) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }

    function render(m) {
      document.getElementById('nickname').textContent = m.nickname;
      document.getElementById('legalName').textContent = m.legalName;
      document.getElementById('kana').textContent = m.kana;
      document.getElementById('memberNo').textContent = m.memberNo;
      document.getElementById('paperNick').textContent = m.nickname;
      document.getElementById('paperLegal').textContent = m.legalName;
      document.getElementById('paperNo').textContent = `No. ${m.memberNo}`;
      drawQr(document.getElementById('qr'), qrPayload(m));
      drawQr(document.getElementById('paperQr'), qrPayload(m));
    }

    render(SAMPLE);
  </script>
</body>
</html>
